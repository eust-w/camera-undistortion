[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-camera-geometry"
version = "0.1.0"
description = "Auto Camera Geometry: pixel<->ray camera infrastructure for ego fisheye stereo rigs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "ruff"]

[project.scripts]
camera-geometry = "camera_geometry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
